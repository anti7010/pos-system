// レシート内容をメール本文にして、端末のメールアプリ（メール/Gmail等）を起動するmailtoリンクを組み立てる
function buildReceiptMailto(email, r) {
  const subject = `店舗POSシステム レシート（${new Date(r.timestamp).toLocaleDateString("ja-JP")}）`;
  const lines = [];
  lines.push("この度はご来店いただき誠にありがとうございました。");
  lines.push("");
  lines.push(`お買い上げ日時: ${new Date(r.timestamp).toLocaleString("ja-JP")}`);
  lines.push(`伝票番号: ${r.id}`);
  if (r.customerName) lines.push(`お客様名: ${r.customerName} 様`);
  lines.push("");
  lines.push("―――――――――――――――");
  r.items.forEach(i => {
    lines.push(`${i.name}  x${i.qty}  ${yen(i.price * i.qty)}`);
  });
  lines.push("―――――――――――――――");
  lines.push(`小計: ${yen(r.subtotal)}`);
  if (r.percentDiscountAmount > 0) lines.push(`割引（${r.discountPercent}%）: -${yen(r.percentDiscountAmount)}`);
  if (r.flatDiscountAmount > 0) lines.push(`値引き: -${yen(r.flatDiscountAmount)}`);
  if (r.discount > 0) lines.push(`ポイント値引: -${yen(r.discount)}`);
  lines.push(`合計: ${yen(r.total)}`);
  if (r.paymentCategory === "cash") {
    lines.push(`お預り: ${yen(r.cash)}`);
    lines.push(`お釣り: ${yen(r.change)}`);
  }
  if (r.pointsEarned > 0) lines.push(`獲得ポイント: ${r.pointsEarned}pt`);
  lines.push("");
  lines.push("またのご来店をお待ちしております。");
  const body = encodeURIComponent(lines.join("\n"));
  return `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${body}`;
}

// ---- クラウド保存（Firestore）。データが無い/オフラインの場合はlocalStorageに自動フォールバック ----
const FS_COLLECTIONS = {
  products: "pos_products",
  customers: "pos_customers",
  sales: "pos_sales"
};
const ID_KEYS = {
  products: "barcode",
  customers: "cardId",
  sales: "id"
};
const SYNC_INTERVAL_MS = 60 * 60 * 1000; // 1時間ごとにクラウド同期

function getDb() {
  try {
    return window.firebase && window.firebase.firestore ? window.firebase.firestore() : null;
  } catch {
    return null;
  }
}

// 匿名認証が完了する（またはあきらめる）まで待つ。認証が無ければ即座に解決する。
async function waitForAuth() {
  if (window.__authReady) {
    try {
      await window.__authReady;
    } catch {}
  }
}

// ---- この端末への即時保存（ネットワーク状況に関わらず必ず成功する） ----
function saveLocal(key, array) {
  try {
    localStorage.setItem("pos_" + key, JSON.stringify(array));
    return true;
  } catch (e) {
    console.error("local save failed", key, e);
    return false;
  }
}
function loadLocal(key, fallback) {
  try {
    const v = localStorage.getItem("pos_" + key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch {
    return fallback;
  }
}

// ---- クラウド未送信の変更を保持するキュー（この端末に保存されるので再読み込みしても消えない） ----
function loadQueue() {
  return loadLocal("sync_queue", {
    upserts: {
      products: {},
      customers: {},
      sales: {}
    },
    deletes: {
      products: [],
      customers: []
    }
  });
}
function saveQueue(q) {
  saveLocal("sync_queue", q);
}
function enqueueUpserts(key, items) {
  const q = loadQueue();
  items.forEach(it => {
    q.upserts[key][String(it[ID_KEYS[key]])] = it;
  });
  saveQueue(q);
}
function enqueueDeletes(key, ids) {
  const q = loadQueue();
  ids.forEach(id => {
    delete q.upserts[key][String(id)];
  });
  const set = new Set(q.deletes[key]);
  ids.forEach(id => set.add(String(id)));
  q.deletes[key] = [...set];
  saveQueue(q);
}
function pendingCount() {
  const q = loadQueue();
  return Object.values(q.upserts.products).length + Object.values(q.upserts.customers).length + Object.values(q.upserts.sales).length + q.deletes.products.length + q.deletes.customers.length;
}
// クラウドから取得した配列に、まだ同期していないローカル変更を重ね合わせる（ローカル優先）
function mergeWithQueue(key, cloudArray) {
  const q = loadQueue();
  const map = new Map(cloudArray.map(it => [String(it[ID_KEYS[key]]), it]));
  Object.values(q.upserts[key]).forEach(it => map.set(String(it[ID_KEYS[key]]), it));
  (q.deletes[key] || []).forEach(id => map.delete(String(id)));
  return [...map.values()];
}

// ---- クラウドから全件取得（失敗時はnullを返す＝呼び出し側は既存データを保持） ----
async function loadCollection(key) {
  const db = getDb();
  if (!db) return null;
  try {
    const snap = await db.collection(FS_COLLECTIONS[key]).get();
    return snap.docs.map(d => d.data());
  } catch (e) {
    console.error("firestore load failed", key, e);
    return null;
  }
}

// ---- 追加・更新（1ドキュメント=1件、大量データでも上限に達しないようバッチ分割）----
async function batchUpsert(key, items) {
  if (!items || items.length === 0) return {
    ok: true,
    error: null
  };
  const db = getDb();
  if (!db) return {
    ok: false,
    error: "Firebase未接続"
  };
  try {
    for (let i = 0; i < items.length; i += 400) {
      const batch = db.batch();
      items.slice(i, i + 400).forEach(it => {
        batch.set(db.collection(FS_COLLECTIONS[key]).doc(String(it[ID_KEYS[key]])), it);
      });
      await batch.commit();
    }
    return {
      ok: true,
      error: null
    };
  } catch (e) {
    console.error("firestore upsert failed", key, e);
    return {
      ok: false,
      error: String(e && e.message ? e.message : e)
    };
  }
}

// ---- 削除（複数ある場合もバッチ分割）----
async function batchDelete(key, ids) {
  if (!ids || ids.length === 0) return {
    ok: true,
    error: null
  };
  const db = getDb();
  if (!db) return {
    ok: false,
    error: "Firebase未接続"
  };
  try {
    for (let i = 0; i < ids.length; i += 400) {
      const batch = db.batch();
      ids.slice(i, i + 400).forEach(id => batch.delete(db.collection(FS_COLLECTIONS[key]).doc(String(id))));
      await batch.commit();
    }
    return {
      ok: true,
      error: null
    };
  } catch (e) {
    console.error("firestore delete failed", key, e);
    return {
      ok: false,
      error: String(e && e.message ? e.message : e)
    };
  }
}

// ---- キューに溜まった変更をクラウドへ送信する ----
async function flushQueueToCloud() {
  const db = getDb();
  if (!db) return {
